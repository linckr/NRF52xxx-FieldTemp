# 基础功能
CONFIG_GPIO=y

# 控制台：使用 RTT（J-Link），关闭 UART 控制台输出
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# I2C 配置 - AHT30 温湿度传感器
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

# SPI 配置 - W25Q64 Flash存储器（SPI 实例由板级 overlay 通过 devicetree 启用）
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# UART 驱动（设备树 uart0 仍存在，仅控制台改为 RTT）
CONFIG_UART_ASYNC_API=n
CONFIG_UART_INTERRUPT_DRIVEN=y

# 日志配置（RTT 控制台，需 J-Link 连接）
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# 内存优化
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=128
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=1024

# 禁用串口控制台 (大幅节省 RAM)
# CONFIG_SERIAL=n
# CONFIG_CONSOLE=n
# CONFIG_UART_CONSOLE=n

# 蓝牙栈内存优化 (BT_HCI_TX_STACK_SIZE 由 nRF 默认设为 1536，勿覆盖)
CONFIG_BT_RX_STACK_SIZE=1024

# 时钟配置
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# 蓝牙配置
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PandaTemp"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_SMP=n
CONFIG_BT_BONDABLE=n
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_CMD_TX_SIZE=65
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_ATT_PREPARE_COUNT=0

# 电源管理（nRF52 系列 52810/52832 等在 NCS 中均未选 HAS_PM，CONFIG_PM 依赖不满足，勿强制 =y）
# CONFIG_PM=y
# CONFIG_PM_DEVICE=y
#
# 【如何打开】
# 1) 换板子时：若新板子/SoC 在 NCS 中已选 HAS_PM（非 nRF52 或后续 NCS 若开放），在 prj.conf 取消上面两行注释即可。
# 2) 当前板子要打开：先确认依赖——CONFIG_PM 依赖 SYS_CLOCK_EXISTS 与 HAS_PM（SoC 提供低功耗钩子）。
#    - 在 build 目录执行：ninja menuconfig → Subsystems and OS → Power Management，查看依赖是否满足。
#    - 若 HAS_PM 未选：在板级 conf（如 boards/<板名>.conf）或 SoC 层添加 select HAS_PM（需改 NCS 板级/SoC 树）。
# 3) 仅要系统级低功耗（k_sleep 进低功耗）：只启用 CONFIG_PM=y；CONFIG_PM_DEVICE 可选。
# 4) 启用 CONFIG_PM_DEVICE 时：app.overlay 中已对 i2c0/adc/flash 删除 zephyr,pm-device-runtime-auto，可避免链接错误。

# DCDC 转换器（降低射频功耗约40%）
# 注意：nrf52dk_nrf52810.dts 已默认启用 DCDC (regulator-initial-mode = NRF5X_REG_MODE_DCDC)

# Flash 配置
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SOC_FLASH_NRF=y

# NVS 配置（配置 + W25Q64 位置存芯片 FLASH，定时 flush）
CONFIG_NVS=y
# CONFIG_SETTINGS=y
# 注意：CONFIG_NVS_LOG_LEVEL 由 Zephyr 日志子系统间接提供，不可在 prj.conf 中直接设置；
# 且当前 CONFIG_LOG=n，NVS 日志已随全局日志关闭。
# NVS 写内部 Flash 时需允许 MPU 写，否则可能 MPU FAULT
CONFIG_MPU_ALLOW_FLASH_WRITE=y
